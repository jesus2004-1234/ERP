{% extends 'finanzas/base_finanzas.html' %}

{% block title %}Nuevo Expediente - ERP FINANZAS{% endblock %}
{% block menu_expedientes %}active{% endblock %}
{% block page_title %}Nuevo Expediente{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            <div class="row">

                <!-- Tipo -->
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipo</label>

                    <select name="tipo" class="form-select" required>
                        <option value="">Selecciona...</option>

                        {% for valor, texto in tipos %}
                        <option value="{{ valor }}">{{ texto }}</option>
                        {% endfor %}

                    </select>
                </div>


                <!-- Tipo contribuyente -->
                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Tipo de contribuyente
                    </label>

                    <select 
                        name="tipo_contribuyente"
                        id="tipo_contribuyente"
                        class="form-select"
                        required>

                        <option value="">
                            Selecciona...
                        </option>

                        {% for valor, texto in tipos_contribuyente %}
                        <option value="{{ valor }}">
                            {{ texto }}
                        </option>
                        {% endfor %}

                    </select>

                </div>



                <!-- Razón social -->
                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Razón social
                    </label>

                    <input 
                        type="text"
                        id="razon_social"
                        name="razon_social"
                        class="form-control">

                </div>



                <!-- Campos Persona Física -->

                <div class="row" id="campos_persona_fisica" style="display:none;">


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Nombre(s)
                        </label>

                        <input 
                            type="text"
                            id="nombres"
                            name="nombres"
                            class="form-control">

                    </div>



                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Apellido paterno
                        </label>

                        <input 
                            type="text"
                            id="apellido_paterno"
                            name="apellido_paterno"
                            class="form-control">

                    </div>



                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Apellido materno
                        </label>

                        <input 
                            type="text"
                            id="apellido_materno"
                            name="apellido_materno"
                            class="form-control">

                    </div>


                </div>



                <!-- Nombre comercial -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Nombre comercial
                    </label>

                    <input 
                        type="text"
                        name="nombre_comercial"
                        class="form-control">

                </div>



                <!-- RFC -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        RFC
                    </label>

                    <input 
                        type="text"
                        id="rfc"
                        name="rfc"
                        class="form-control"
                        placeholder="Seleccione tipo contribuyente">


                    <div 
                        class="form-text"
                        id="mensaje_rfc">
                    </div>

                </div>

                <!--Regimen fiscal-->

                <div class="col-md-4 mb-3">
                    <label class="form-label">
                        Regimen Fiscal
                    </label>

                    <select name="regimen_fiscal" class="form-select">
                        <option value="">
                            Seleccione...
                        </option>
                        {% for valor, texto  in regimenes %}
                            <option value="{{valor}}">
                                {{texto}}
                            </option>
                        {% endfor %}
                    </select>
                </div>



                <!-- Crédito -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Días de crédito
                    </label>

                    <input 
                        type="number"
                        name="dias_credito"
                        class="form-control"
                        value="0"
                        min="0">

                </div>



                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Límite de crédito
                    </label>

                    <input 
                        type="number"
                        name="limite_credito"
                        class="form-control"
                        step="0.01">

                </div>



                <!-- Contacto -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Contacto
                    </label>

                    <input 
                        type="text"
                        name="contacto_nombre"
                        class="form-control">

                </div>


                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input 
                        type="text"
                        name="contacto_telefono"
                        class="form-control">

                </div>



                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Correo
                    </label>

                    <input 
                        type="email"
                        name="contacto_email"
                        class="form-control">

                </div>


                <!-- Correo para envío de pagos (solo Proveedor) -->

                <div class="col-md-4 mb-3" id="campo_correo_pagos" style="display:none;">

                    <label class="form-label">
                        Correo para envío de pagos
                    </label>

                    <input 
                        type="email"
                        name="correo_pagos"
                        id="correo_pagos"
                        class="form-control"
                        placeholder="Solo para proveedores">

                </div>



                <!-- Dirección -->

                <div class="col-md-8 mb-3">

                    <label class="form-label">
                        Dirección
                    </label>

                    <input 
                        type="text"
                        name="direccion"
                        class="form-control">

                </div>



                <!-- Estatus -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Estatus
                    </label>

                    <select 
                        name="estatus"
                        class="form-select"
                        required>

                        {% for valor, texto in estatuses %}

                        <option 
                            value="{{ valor }}"
                            {% if valor == estatus_default %}
                            selected
                            {% endif %}>
                            {{ texto }}
                        </option>

                        {% endfor %}

                    </select>

                </div>



                <!-- Observaciones -->

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Observaciones
                    </label>

                    <textarea
                        name="observaciones"
                        class="form-control"
                        rows="2"></textarea>

                </div>


            </div>



            <div class="d-flex gap-2">

                <button 
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-save"></i>
                    Guardar

                </button>


                <a 
                    href="{% url 'expedientes_lista' %}"
                    class="btn btn-secondary">

                    <i class="bi bi-x-circle"></i>
                    Cancelar

                </a>

            </div>


        </form>

    </div>
</div>



<script>

document.addEventListener("DOMContentLoaded", function(){


    const tipo = document.getElementById("tipo_contribuyente");

    const rfc = document.getElementById("rfc");

    const mensaje = document.getElementById("mensaje_rfc");

    const camposPF = document.getElementById("campos_persona_fisica");

    const camposPFInputs = camposPF.querySelectorAll("input");

    const razon = document.getElementById("razon_social");

    const nombres = document.getElementById("nombres");
    const paterno = document.getElementById("apellido_paterno");
    const materno = document.getElementById("apellido_materno");

    const tipoExpediente = document.querySelector('select[name="tipo"]');
    const campoCorreoPagos = document.getElementById("campo_correo_pagos");
    const correoPagos = document.getElementById("correo_pagos");


    function actualizarCorreoPagos(){

        if(tipoExpediente.value === "Proveedor"){

            campoCorreoPagos.style.display = "block";
            correoPagos.disabled = false;

        } else {

            campoCorreoPagos.style.display = "none";
            correoPagos.disabled = true;
            correoPagos.value = "";

        }

    }


    tipoExpediente.addEventListener("change", actualizarCorreoPagos);

    actualizarCorreoPagos();



    function actualizarFormulario(){

        // Evita el conflicto maxLength < minLength al cambiar de tipo
        rfc.minLength = 0;

        if(tipo.value === "PF"){


            camposPF.style.display = "flex";

            camposPFInputs.forEach(i => i.disabled = false);


            razon.readOnly = true;


            rfc.maxLength = 13;
            rfc.minLength = 13;

            rfc.placeholder =
            "RFC Persona Física";


            mensaje.innerHTML =
            "Persona Física: RFC de <strong>13 caracteres</strong>";


        }


        else if(tipo.value === "PM"){


            camposPF.style.display = "none";

            camposPFInputs.forEach(i => i.disabled = true);


            razon.readOnly = false;


            rfc.maxLength = 12;
            rfc.minLength = 12;


            rfc.placeholder =
            "RFC Persona Moral";


            mensaje.innerHTML =
            "Persona Moral: RFC de <strong>12 caracteres</strong>";

        }


        else{


            camposPF.style.display = "none";

            camposPFInputs.forEach(i => i.disabled = true);


            razon.readOnly = false;


            rfc.removeAttribute("maxlength");
            rfc.removeAttribute("minlength");


            mensaje.innerHTML = "";

        }


        rfc.value="";

    }



    function generarRazonSocial(){

        razon.value =
        `${nombres.value} ${paterno.value} ${materno.value}`.trim();

    }



    nombres.addEventListener("input", generarRazonSocial);
    paterno.addEventListener("input", generarRazonSocial);
    materno.addEventListener("input", generarRazonSocial);


    tipo.addEventListener(
        "change",
        actualizarFormulario
    );


    actualizarFormulario();


});

// Todos los campos que deberán escribirse en MAYÚSCULAS
const camposMayusculas = document.querySelectorAll(`
    input[type="text"],
    textarea
`);

// Convertir mientras escribe, preservando la posición del cursor
camposMayusculas.forEach(campo => {
    campo.addEventListener("input", function () {
        const pos = this.selectionStart;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(pos, pos);
    });
});

</script>


{% endblock %}
