{% extends 'finanzas/base_finanzas.html' %}

{% block title %}Nuevo Expediente - ERP FINANZAS{% endblock %}
{% block menu_expedientes %}active{% endblock %}
{% block page_title %}Nuevo Expediente{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-select" required>
                        <option value="">Selecciona...</option>
                        {% for valor, texto in tipos %}
                        <option value="{{ valor }}">{{ texto }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Razón social</label>
                    <input type="text" name="razon_social" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nombre comercial</label>
                    <input type="text" name="nombre_comercial" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">RFC</label>
                    <input type="text" name="rfc" class="form-control" maxlength="13"
                           placeholder="Opcional para clientes">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Días de crédito</label>
                    <input type="number" name="dias_credito" class="form-control" value="0" min="0">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Límite de crédito</label>
                    <input type="number" name="limite_credito" class="form-control" step="0.01" min="0">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Contacto</label>
                    <input type="text" name="contacto_nombre" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="contacto_telefono" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="contacto_email" class="form-control">
                </div>

                <div class="col-md-8 mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estatus</label>
                    <select name="estatus" class="form-select" required>
                        {% for valor, texto in estatuses %}
                        <option value="{{ valor }}" {% if valor == "Activo" %}selected{% endif %}>{{ texto }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="{% url 'expedientes_lista' %}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
