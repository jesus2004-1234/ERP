{% extends 'finanzas/base_finanzas.html' %}

{% block title %}Editar Expediente - ERP FINANZAS{% endblock %}
{% block menu_expedientes %}active{% endblock %}
{% block page_title %}Editar Expediente{% endblock %}

{% block content %}

<div class="card">
<div class="card-body">

<form method="post">

{% csrf_token %}

<div class="row">


<!-- TIPO -->
<div class="col-md-4 mb-3">

<label class="form-label">
Tipo
</label>

<select name="tipo" class="form-select" required>

{% for valor, texto in tipos %}

<option value="{{ valor }}"
{% if expediente.tipo == valor %}selected{% endif %}>

{{ texto }}

</option>

{% endfor %}

</select>

</div>



<!-- TIPO CONTRIBUYENTE -->
<div class="col-md-4 mb-3">

<label class="form-label">
Tipo de contribuyente
</label>


<select 
name="tipo_contribuyente"
id="tipo_contribuyente"
class="form-select"
required>


{% for valor,texto in tipos_contribuyente %}

<option value="{{ valor }}"
{% if expediente.tipo_contribuyente == valor %}selected{% endif %}>

{{ texto }}

</option>

{% endfor %}


</select>

</div>



<!-- RAZON SOCIAL -->
<div class="col-md-4 mb-3" id="campo_razon">


<label class="form-label">
Razón social
</label>


<input 
type="text"
name="razon_social"
id="razon_social"
class="form-control"
value="{{ expediente.razon_social }}">


</div>





<!-- CAMPOS PERSONA FISICA -->

<div id="campos_pf" class="row">


<div class="col-md-4 mb-3">


<label class="form-label">
Nombre(s)
</label>


<input 
type="text"
name="nombres"
class="form-control"
value="{{ expediente.nombres }}">


</div>



<div class="col-md-4 mb-3">


<label class="form-label">
Apellido paterno
</label>


<input 
type="text"
name="apellido_paterno"
class="form-control"
value="{{ expediente.apellido_paterno }}">


</div>




<div class="col-md-4 mb-3">


<label class="form-label">
Apellido materno
</label>


<input 
type="text"
name="apellido_materno"
class="form-control"
value="{{ expediente.apellido_materno }}">


</div>



</div>





<!-- NOMBRE COMERCIAL -->

<div class="col-md-4 mb-3">

<label class="form-label">
Nombre comercial
</label>


<input 
type="text"
name="nombre_comercial"
class="form-control"
value="{{ expediente.nombre_comercial }}">


</div>






<!-- RFC -->

<div class="col-md-4 mb-3">

<label class="form-label">
RFC
</label>


<input 
type="text"
id="rfc"
name="rfc"
class="form-control"
value="{{ expediente.rfc|default:'' }}">


<div class="form-text" id="mensaje_rfc"></div>


</div>

<!--REGIMEN FISCAL-->

<div class="col-md-4 mb-3">
    <label class="form-label">
        Regimen Fiscal
    </label>

        <select name="regimen_fiscal" class="form-select">
            <option value="">
                Seleccione...
            </option>
            {% for valor, texto  in regimenes %}
                <option value="{{valor}}"
                {% if expediente.regimen_fiscal == valor %}selected{% endif %}>
                    {{texto}}
                </option>
            {% endfor %}
        </select>
</div>


<!-- DIAS CREDITO -->

<div class="col-md-4 mb-3">

<label class="form-label">
Días de crédito
</label>


<input 
type="number"
name="dias_credito"
class="form-control"
value="{{ expediente.dias_credito }}"
min="0">


</div>





<!-- LIMITE CREDITO -->

<div class="col-md-4 mb-3">


<label class="form-label">
Límite de crédito
</label>


<input 
type="number"
name="limite_credito"
class="form-control"
step="0.01"
value="{{ expediente.limite_credito|default:'' }}">


</div>





<!-- CONTACTO -->

<div class="col-md-4 mb-3">

<label class="form-label">
Contacto
</label>


<input 
type="text"
name="contacto_nombre"
class="form-control"
value="{{ expediente.contacto_nombre }}">


</div>



<div class="col-md-4 mb-3">

<label class="form-label">
Teléfono
</label>


<input 
type="text"
name="contacto_telefono"
class="form-control"
value="{{ expediente.contacto_telefono }}">


</div>




<div class="col-md-4 mb-3">

<label class="form-label">
Correo
</label>


<input 
type="email"
name="contacto_email"
class="form-control"
value="{{ expediente.contacto_email }}">


</div>


<!-- CORREO PARA ENVIO DE PAGOS (solo Proveedor) -->

<div class="col-md-4 mb-3" id="campo_correo_pagos" style="display:none;">

<label class="form-label">
Correo para envío de pagos
</label>


<input 
type="email"
name="correo_pagos"
id="correo_pagos"
class="form-control"
value="{{ expediente.correo_pagos }}"
placeholder="Solo para proveedores">


</div>





<!-- DIRECCION -->

<div class="col-md-8 mb-3">

<label class="form-label">
Dirección
</label>


<input 
type="text"
name="direccion"
class="form-control"
value="{{ expediente.direccion }}">


</div>






<!-- ESTATUS -->

<div class="col-md-4 mb-3">

<label class="form-label">
Estatus
</label>


<select name="estatus" class="form-select">


{% for valor,texto in estatuses %}

<option value="{{ valor }}"
{% if expediente.estatus == valor %}selected{% endif %}>

{{ texto }}

</option>

{% endfor %}


</select>


</div>






<!-- OBSERVACIONES -->

<div class="col-12 mb-3">


<label class="form-label">
Observaciones
</label>


<textarea 
name="observaciones"
class="form-control"
rows="2">{{ expediente.observaciones }}</textarea>


</div>



</div>





<button class="btn btn-warning">

<i class="bi bi-save"></i>

Actualizar

</button>


<a href="{% url 'expedientes_lista' %}" 
class="btn btn-secondary">

Cancelar

</a>



</form>


</div>
</div>





<script>

document.addEventListener("DOMContentLoaded",function(){


const tipo=document.getElementById("tipo_contribuyente");

const camposPF=document.getElementById("campos_pf");

const camposPFInputs=camposPF.querySelectorAll("input");

const razon=document.getElementById("razon_social");

const rfc=document.getElementById("rfc");

const mensaje=document.getElementById("mensaje_rfc");

const tipoExpediente=document.querySelector('select[name="tipo"]');
const campoCorreoPagos=document.getElementById("campo_correo_pagos");
const correoPagos=document.getElementById("correo_pagos");


function actualizarCorreoPagos(){

if(tipoExpediente.value==="Proveedor"){

campoCorreoPagos.style.display="block";
correoPagos.disabled=false;

} else {

campoCorreoPagos.style.display="none";
correoPagos.disabled=true;
correoPagos.value="";

}

}


tipoExpediente.addEventListener("change", actualizarCorreoPagos);

actualizarCorreoPagos();



function cambiarTipo(){

// Evita el conflicto maxLength < minLength al cambiar de tipo
rfc.minLength=0;


if(tipo.value==="PF"){


camposPF.style.display="flex";

camposPFInputs.forEach(i => i.disabled = false);


razon.disabled=true;

razon.required=false;



rfc.maxLength=13;

rfc.minLength=13;

rfc.placeholder="RFC Persona Física 13 caracteres";


mensaje.innerHTML=
"Persona Física: RFC debe contener <strong>13 caracteres</strong>";



}



else if(tipo.value==="PM"){


camposPF.style.display="none";

camposPFInputs.forEach(i => i.disabled = true);


razon.disabled=false;

razon.required=true;



rfc.maxLength=12;

rfc.minLength=12;


rfc.placeholder="RFC Persona Moral 12 caracteres";


mensaje.innerHTML=
"Persona Moral: RFC debe contener <strong>12 caracteres</strong>";



}


// Si el RFC ya escrito excede el nuevo límite, se recorta y se avisa
if(rfc.value.length > rfc.maxLength){

rfc.value = rfc.value.slice(0, rfc.maxLength);

mensaje.innerHTML += " <span class='text-danger'>(RFC recortado, verifica el valor antes de guardar)</span>";

}



}



tipo.addEventListener(
"change",
cambiarTipo
);



cambiarTipo();



});

// Todos los campos que deberán escribirse en MAYÚSCULAS
const camposMayusculas = document.querySelectorAll(`
    input[type="text"],
    textarea
`);

// Convertir mientras escribe, preservando la posición del cursor
camposMayusculas.forEach(campo => {
    campo.addEventListener("input", function () {
        const pos = this.selectionStart;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(pos, pos);
    });
});

</script>


{% endblock %}
