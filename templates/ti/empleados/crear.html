{% extends 'base.html' %}

{% block title %}Nuevo Empleado - ERP INNOVACION Y TECNOLOGIA{% endblock %}
{% block menu_empleados %}active{% endblock %}
{% block page_title %}Nuevo Empleado{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="apellido" class="form-control" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label">Departamento</label>
                    <select name="departamento" class="form-select requiered">
                        <option value="">Selecciona un departamento</option>
                        <option value="Direccion General">Direccion General</option>
                        <option value="Gerencia de Administracion y Finanzas">Gerencia de Administracion y Finanzas</option>
                        <option value="Conexion Comercial">Conexion Comercial</option>
                        <option value="Planeacion y Control Financiero">Planeacion y Control Financiero</option>
                        <option value="Capital Humano y Gestion Integral">Capital Humano y Gestion Integral</option>
                        <option value="Operaciones y Servicios Generales">Operaciones y Servicios Generales</option>
                        <option value="Innovación y Tecnología">Innovación y Tecnología</option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="/empleados/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
