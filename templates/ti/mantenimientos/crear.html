{% extends 'base.html' %}

{% block title %}Nuevo Mantenimiento - ERP INNOVACION Y TECNOLOGIA{% endblock %}
{% block menu_mantenimientos %}active{% endblock %}
{% block page_title %}Nuevo Mantenimiento{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Equipo</label>
                    <select name="equipo" class="form-select" required>
                        <option value="">Selecciona un equipo</option>
                        {% for equipo in equipos %}
                        <option value="{{ equipo.pk }}">{{ equipo.marca }} {{ equipo.modelo }} ({{ equipo.numero_serie }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-select" required>
                        <option value="Preventivo">Preventivo</option>
                        <option value="Correctivo">Correctivo</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estatus</label>
                    <select name="estatus" class="form-select" required>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Vencido">Vencido</option>
                        <option value="Al_dia">Al dia</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Realizado por</label>
                    <input type="text" name="realizado_por" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Última fecha de mantenimiento</label>
                    <input type="date" name="ultima_fecha_mantenimiento" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Próxima fecha de mantenimiento</label>
                    <input type="date" name="proxima_fecha_mantenimiento" class="form-control">
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="/mantenimientos/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
