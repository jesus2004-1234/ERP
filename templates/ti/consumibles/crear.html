{% extends 'base.html' %}

{% block title %}Nuevo Consumible - ERP TI{% endblock %}
{% block menu_consumibles %}active{% endblock %}
{% block page_title %}Nuevo Consumible{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoria" class="form-select" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="papeleria">Papelería</option>
                        <option value="toner">Tóner</option>
                        <option value="cable">Cable</option>
                        <option value="accesorio">Accesorio</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Stock actual</label>
                    <input type="number" name="stock_actual" class="form-control" min="0" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Unidad de medida</label>
                    <input type="text" name="unidad_medida" class="form-control" placeholder="piezas, cajas, etc.">
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="/consumibles/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
