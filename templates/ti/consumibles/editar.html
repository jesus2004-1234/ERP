{% extends 'ti/base.html' %}

{% block title %}Editar Consumible - ERP INNOVACION Y TECNOLOGIA{% endblock %}
{% block menu_consumibles %}active{% endblock %}
{% block page_title %}Editar Consumible{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ consumible.nombre }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoria" class="form-select" required>
                        <option value="Papeleria" {% if consumible.categoria == 'Papeleria' %}selected{% endif %}>Papeleria</option>
                        <option value="Toner" {% if consumible.categoria == 'Toner' %}selected{% endif %}>Toner</option>
                        <option value="Cable" {% if consumible.categoria == 'Cable' %}selected{% endif %}>Cable</option>
                        <option value="Accesorio" {% if consumible.categoria == 'Accesorio' %}selected{% endif %}>Accesorio</option>
                        <option value="Otro" {% if consumible.categoria == 'Otro' %}selected{% endif %}>Otro</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Stock actual</label>
                    <input type="number" name="stock_actual" class="form-control" value="{{ consumible.stock_actual }}" min="0" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Unidad de medida</label>
                    <input type="text" name="unidad_medida" class="form-control" value="{{ consumible.unidad_medida|default:'' }}" placeholder="piezas, cajas, etc.">
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3">{{ consumible.descripcion|default:'' }}</textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-save"></i> Actualizar
                </button>
                <a href="{% url 'consumibles_lista' %}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
