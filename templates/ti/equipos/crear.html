{% extends 'base.html' %}

{% block title %}Nuevo Equipo - ERP TI{% endblock %}
{% block menu_equipos %}active{% endblock %}
{% block page_title %}Nuevo Equipo{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-select" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="Computadora">Computadora</option>
                        <option value="Impresora">Impresora</option>
                        <option value="Proyector">Proyector</option>
                        <option value="Teléfono">Teléfono</option>
                        <option value="Teclado">Teclado</option>
                        <option value="Mouse">Mouse</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Marca</label>
                    <input type="text" name="marca" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Modelo</label>
                    <input type="text" name="modelo" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Número de serie</label>
                    <input type="text" name="numero_serie" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sistema operativo</label>
                    <input type="text" name="sistema_operativo" class="form-control" placeholder="Opcional">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estatus</label>
                    <select name="estatus" class="form-select" required>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="En reparación">En reparación</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Responsable</label>
                    <select name="responsable" class="form-select">
                        <option value="">Sin responsable</option>
                        {% for empleado in empleados %}
                        <option value="{{ empleado.pk }}">{{ empleado.nombre }} {{ empleado.apellido }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Departamento</label>
                    <select name="departamento" class="form-select requiered">
                        <option value="">Selecciona un departamento</option>
                        <option value="Direccion General">Direccion General</option>
                        <option value="Gerencia de Administracion y Finanzas">Gerencia de Administracion y Finanzas</option>
                        <option value="Conexion Comercial">Conexion Comercial</option>
                        <option value="Planeacion y Control Financiero">Planeacion y Control Financiero</option>
                        <option value="Capital Humano y Gestion Integral">Capital Humano y Gestion Integral</option>
                        <option value="Operaciones y Servicios Generales">Operaciones y Servicios Generales</option>
                        <option value="Innovación y Tecnología">Innovación y Tecnología</option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="/equipos/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
