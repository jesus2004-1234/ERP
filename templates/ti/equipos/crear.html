{% extends 'base.html' %}

{% block title %}Nuevo Equipo - ERP INNOVACION Y TECNOLOGIA{% endblock %}
{% block menu_equipos %}active{% endblock %}
{% block page_title %}Nuevo Equipo{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-select" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="Computadora">Computadora</option>
                        <option value="Impresora">Impresora</option>
                        <option value="Proyector">Proyector</option>
                        <option value="Teléfono">Teléfono</option>
                        <option value="Teclado">Teclado</option>
                        <option value="Mouse">Mouse</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Marca</label>
                    <input type="text" name="marca" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Modelo</label>
                    <input type="text" name="modelo" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Número de serie</label>
                    <input type="text" name="numero_serie" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sistema operativo</label>
                    <input type="text" name="sistema_operativo" class="form-control" placeholder="Opcional">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estatus</label>
                    <select name="estatus" class="form-select" required>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="En reparación">En reparación</option>
                        <option value="Baja">Baja</option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="/equipos/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
