{% extends 'base.html' %}

{% block title %}Nuevo Correo / Línea - ERP INNOVACION Y TECNOLOGIA{% endblock %}
{% block menu_correos %}active{% endblock %}
{% block page_title %}Nuevo Correo / Línea{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-select" required>
                        <option value="Correo">Correo electrónico</option>
                        <option value="Linea">Línea telefónica</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Correo / Número</label>
                    <input type="text" name="correo_asignado" class="form-control" 
                           placeholder="correo@dosa.com o 938-000-0000" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Empleado</label>
                    <select name="empleado" class="form-select">
                        <option value="">Sin empleado asignado</option>
                        {% for empleado in empleados %}
                        <option value="{{ empleado.pk }}">{{ empleado.nombre }} {{ empleado.apellido }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Estatus</label>
                    <select name="estatus" class="form-select" required>
                        <option value="Disponible">Disponible</option>
                        <option value="Ocupado">Ocupado</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar
                </button>
                <a href="/correos/" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
