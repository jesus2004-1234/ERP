{% extends 'base.html' %}

{% block title %}Control Documental - ERP INNOVACION Y TECNOLOGIA{% endblock %}
{% block menu_control_documental %}active{% endblock %}
{% block page_title %}Control Documental{% endblock %}

{% block content %}

<div class= "d-flex justify-content-end mb-3">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDocumento">
        <i class="bi bi-upload"></i> Subir documento
    </button>
</div>

<div class="modal fade" id="modalDocumento">

    <div class="modal-dialog">

        <div class="modal-content">

            <form
                method="POST"
                enctype="multipart/form-data">

                {% csrf_token %}

                <div class="modal-header">

                    <h5>Subir documento</h5>

                </div>

                <div class="modal-body">

                    <label>Categoría</label>

                    <select
                        name="categoria"
                        class="form-select">
                        <option value="">Selecciona una categoría</option>
                        {% for valor,texto in categorias %}
                            <option value="{{ valor }}">
                                {{ texto }}
                            </option>
                        {% endfor %}

                    </select>

                    <br>

                    <label>Archivo</label>

                    <input
                        type="file"
                        name="archivo"
                        class="form-control"
                        required>

                </div>

                <div class="modal-footer">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>

                </div>

            </form>

        </div>

    </div>

</div>
{% endblock %}
